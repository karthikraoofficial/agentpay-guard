name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: agentpay
          POSTGRES_PASSWORD: agentpay # CI-only throwaway database
          POSTGRES_DB: agentpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentpay -d agentpay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AGENTPAY_ENV: test
      AGENTPAY_DATABASE_URL: postgresql+psycopg://agentpay:agentpay@localhost:5432/agentpay
      AGENTPAY_TEMPORAL_ADDRESS: localhost:7233
      AGENTPAY_OTEL_EXPORTER_ENDPOINT: http://localhost:4318
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Released policy packs are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          bash .github/scripts/check-released-packs.sh FETCH_HEAD

      - name: Migrations
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest

      - name: Evals (fails on any false-allow, false-block or wrong reason code)
        run: uv run python -m evals.run_evals

      - name: Latency budgets (decide p99 < 5 ms, POST /v1/decisions p95 < 150 ms)
        run: uv run pytest -m perf -s -o addopts=""

      - name: Consent workflow on Temporal (worker killed mid-wait, resumed by signal and timer)
        run: uv run pytest -m workflow -o addopts=""

