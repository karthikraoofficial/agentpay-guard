# Default Policy pack, Phase 4: the 1.2.0 parameters plus the Payment window. The rules and
# Signals (ADR-0006) are unchanged. Released packs are immutable (ADR-0002): to change a value,
# copy this file to a new version, edit the copy, and add it to manifest.json.
# Amounts are integer minor units (paise, cents).
id: default
version: "1.3.0"

# Risk tier bands. Below medium_from is low; at or above step_up_threshold is high and
# needs Payer approval. INR 5,000 is deliberately stricter than RBI's current INR 15,000
# e-mandate limit for debits without an additional factor of authentication.
currencies:
  INR:
    medium_from: 200000        # INR 2,000.00
    step_up_threshold: 500000  # INR 5,000.00
  USD:
    medium_from: 2500          # USD 25.00
    step_up_threshold: 10000   # USD 100.00

# Blocked for every Tenant and Mandate: gambling, quasi-cash, money transfer.
high_risk_mccs: ["4829", "6051", "7995"]

# Step up once Spent this month plus the amount reaches this share of the Monthly cap.
monthly_cap_near_ratio_bps: 8000  # 80%

# Evaluated in this order; every enabled rule runs and the most severe result wins.
rules:
  - {rule_id: mandate_revoked, enabled: true}
  - {rule_id: mandate_validity, enabled: true}
  - {rule_id: agent_allowed, enabled: true}
  - {rule_id: agent_disabled, enabled: true}
  - {rule_id: currency_match, enabled: true}
  - {rule_id: mcc_high_risk, enabled: true}
  - {rule_id: mcc_allowed, enabled: true}
  - {rule_id: per_txn_cap, enabled: true}
  - {rule_id: monthly_cap, enabled: true}
  - {rule_id: step_up_threshold, enabled: true}
  - {rule_id: monthly_cap_near, enabled: true}
  - {rule_id: velocity, enabled: true}
  - {rule_id: merchant_new, enabled: true}
  - {rule_id: intent, enabled: true}
  - {rule_id: price_drift, enabled: true}

# --- Signals (step_up only) ---------------------------------------------------------

# Step up once 5 earlier Decisions on the Mandate, of any Outcome, fall in the last 10 min.
velocity:
  max_decisions: 5
  window_seconds: 600

# Step up a first payment to a merchant (for this Payer, under any Mandate) from medium up.
merchant_new:
  min_tier: medium

# From medium up, a Decision needs a usable Intent check whose verdict is match. A check
# can be cited for 30 minutes.
intent:
  verdict_ttl_seconds: 1800
  min_tier: medium

# Step up when the amount is more than 2% above the cited Intent check's Quoted total.
price_drift:
  max_above_bps: 200

# --- Step-up consent (Phase 3) ------------------------------------------------------

# How long the Payer has to approve or decline a Consent request (ADR-0009). Packs before
# 1.2.0 don't set it and read as the same 600.
consent_ttl_seconds: 600  # 10 minutes

# --- Payments (Phase 4) -------------------------------------------------------------

# How long an allow can be paid after its Decision time, or an approved step-up after its
# Consent resolution. No rule reads it. Packs before 1.3.0 don't set it and read as 900.
payment_window_seconds: 900  # 15 minutes
