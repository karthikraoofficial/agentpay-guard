<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>buildviz</title>
<style>
  :root {
    --bg:#f5f5f8; --dot:#d2d2dc; --surface:#ffffff; --surface-2:#eeeef3; --border:#d8d8e2; --edge:#b4b4c4;
    --text:#1a1a22; --muted:#626272; --accent:#4f46e5;
    --pending:#6f6f80; --queued:#9a5b00; --running:#2158d8; --done:#12783a; --failed:#c42626; --skipped:#707080;
    --on-solid:#ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#14141a; --dot:#2a2a35; --surface:#1e1e27; --surface-2:#282833; --border:#34343f; --edge:#4c4c5c;
      --text:#ececf3; --muted:#a0a0b0; --accent:#8b83ff;
      --pending:#9a9aab; --queued:#e3a93e; --running:#6aa2ff; --done:#45c673; --failed:#ff7070; --skipped:#9090a0;
      --on-solid:#101016;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button {
    font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-solid); font-weight: 600; }
  :where(button, input, .node, pre):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .topbar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand h1 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { flex: 1 1 180px; min-width: 140px; display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--done); transition: width .3s; }
  .bar.has-fail > div { background: var(--failed); }
  #progtext { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; user-select: none; }

  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
  .pill.s-running { background: color-mix(in srgb, var(--running) 16%, transparent); color: var(--running); }
  .pill.s-done { background: color-mix(in srgb, var(--done) 16%, transparent); color: var(--done); }
  .pill.s-failed { background: color-mix(in srgb, var(--failed) 16%, transparent); color: var(--failed); }
  .pill.s-queued { background: color-mix(in srgb, var(--queued) 16%, transparent); color: var(--queued); }

  .banner { padding: 8px 16px; background: color-mix(in srgb, var(--failed) 14%, var(--surface)); color: var(--text); border-bottom: 1px solid var(--failed); }
  .banner.info { background: var(--surface-2); border-color: var(--border); }

  .phases { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; border-bottom: 1px solid var(--border); background: var(--surface); }
  .phases[hidden] { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; border-radius: 99px; padding: 4px 12px; font-size: 13px; }
  .chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .chip .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip.all-done .mark { color: var(--done); } .chip.has-fail .mark { color: var(--failed); } .chip.is-running .mark { color: var(--running); }

  main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; flex: 1; min-height: 0; }
  .canvas { position: relative; min-width: 0; min-height: 0; background: var(--bg); }
  #graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #graph.panning { cursor: grabbing; }
  .zoom { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
  .zoom button { min-width: 36px; padding: 6px 10px; }
  .legend { position: absolute; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: 70%; justify-content: flex-end; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .hint { position: absolute; left: 12px; top: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }

  /* graph */
  .node { cursor: pointer; transition: opacity .15s; }
  .node .card { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
  .node:hover .card { stroke: var(--muted); }
  .node.sel .card { stroke: var(--accent); stroke-width: 2.5; }
  .node:focus { outline: none; } .node:focus-visible .card { stroke: var(--accent); stroke-width: 3; }
  .node .stripe { fill: var(--pending); }
  .node .title { font-size: 14px; font-weight: 600; fill: var(--text); }
  .node .sub { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .node .phase { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; fill: var(--muted); }
  .node .port { fill: var(--surface); stroke: var(--edge); stroke-width: 1.5; }
  .node.s-queued .stripe { fill: var(--queued); }
  .node.s-running .stripe { fill: var(--running); } .node.s-running .card { stroke: var(--running); } .node.s-running .sub { fill: var(--running); }
  .node.s-done .stripe { fill: var(--done); } .node.s-done .sub { fill: var(--done); }
  .node.s-failed .stripe { fill: var(--failed); } .node.s-failed .card { stroke: var(--failed); } .node.s-failed .sub { fill: var(--failed); }
  .node.s-skipped .stripe { fill: var(--skipped); } .node.s-skipped .card { stroke-dasharray: 5 4; }
  .node.dim, .edge.dim { opacity: .28; }
  .ico { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ico .fill-done { fill: var(--done); stroke: none; } .ico .fill-failed { fill: var(--failed); stroke: none; }
  .ico .mark { stroke: var(--on-solid); }
  .ico .ring-pending { stroke: var(--pending); } .ico .ring-queued { stroke: var(--queued); } .ico .ring-skipped { stroke: var(--skipped); stroke-dasharray: 3 2.5; }
  .ico .arc { stroke: var(--running); }
  .spin { animation: spin 1s linear infinite; transform-origin: 0 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .edge { fill: none; stroke: var(--edge); stroke-width: 2; transition: opacity .15s; }
  .edge.e-done { stroke: var(--done); } .edge.e-failed { stroke: var(--failed); }
  .edge.flow { stroke: var(--running); stroke-dasharray: 7 6; animation: dash .7s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -13; } }
  @media (prefers-reduced-motion: reduce) { .spin, .edge.flow { animation: none; } }

  /* detail panel */
  .panel { width: 400px; max-width: 100%; border-left: 1px solid var(--border); background: var(--surface); padding: 16px; overflow-y: auto; }
  .panel[hidden] { display: none; }
  .panel-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .panel h2 { margin: 0; font-size: 18px; } .panel h3 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .icon-btn { padding: 2px 9px; }
  .muted { color: var(--muted); }
  .panel-status { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .panel-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
  .meta dt { color: var(--muted); } .meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .dep { margin: 0 4px 4px 0; padding: 1px 9px; border-radius: 99px; font-size: 12px; }
  pre.code { margin: 0; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  pre.log { max-height: 42vh; overflow: auto; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    .panel { position: absolute; left: 0; right: 0; bottom: 0; width: auto; max-height: 62%; border-left: 0; border-top: 1px solid var(--border); box-shadow: 0 -8px 24px rgba(0,0,0,.25); }
    .legend, .hint { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1 id="project">Build</h1>
    <span id="runstate" class="pill" aria-live="polite">Loading…</span>
  </div>
  <div class="progress" role="group" aria-label="Overall progress">
    <div class="bar" id="bar"><div></div></div>
    <span id="progtext"></span>
  </div>
  <div class="actions">
    <label class="toggle"><input type="checkbox" id="auto" checked> Auto-refresh</label>
    <button id="refresh" type="button">Refresh</button>
    <button id="stop" type="button" hidden>Stop</button>
    <button id="runall" type="button" class="primary">Run all</button>
  </div>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<nav id="phases" class="phases" aria-label="Phases" hidden></nav>
<main>
  <section class="canvas">
    <svg id="graph" role="group" aria-label="Build graph">
      <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="var(--dot)"/></pattern>
        <clipPath id="clipcard"><rect width="224" height="72" rx="12"/></clipPath>
      </defs>
      <g id="viewport">
        <rect x="-6000" y="-6000" width="12000" height="12000" fill="url(#dots)"/>
        <g id="edges"></g>
        <g id="nodes"></g>
      </g>
    </svg>
    <div class="hint">Drag to pan · Ctrl/⌘ + scroll to zoom · click a module for details</div>
    <div class="zoom">
      <button id="zin" type="button" aria-label="Zoom in">+</button>
      <button id="zout" type="button" aria-label="Zoom out">−</button>
      <button id="zfit" type="button">Fit</button>
    </div>
    <div class="legend" id="legend" aria-label="Status legend"></div>
  </section>
  <aside id="panel" class="panel" hidden aria-label="Module details">
    <div class="panel-head">
      <div><div id="p-phase" class="eyebrow"></div><h2 id="p-title"></h2></div>
      <button id="p-close" type="button" class="icon-btn" aria-label="Close details">✕</button>
    </div>
    <div class="panel-status"><span id="p-status" class="pill"></span><span id="p-time" class="muted"></span></div>
    <p id="p-desc" class="muted"></p>
    <div class="panel-actions">
      <button id="p-run" type="button" class="primary" title="Builds this module (plus any unfinished modules it depends on)">Run this module</button>
      <button id="p-run-down" type="button" title="Builds this module and everything that depends on it">Run + downstream</button>
    </div>
    <dl id="p-meta" class="meta"></dl>
    <h3>Command</h3>
    <pre id="p-cmd" class="code"></pre>
    <h3>Output</h3>
    <pre id="p-log" class="code log" tabindex="0"></pre>
  </aside>
</main>

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const W = 224, H = 72, GX = 96, GY = 28;
const STATUS_LABEL = { pending: 'Pending', queued: 'Queued', running: 'Running', done: 'Done', failed: 'Failed', skipped: 'Skipped' };
const $ = s => document.querySelector(s);

let model = null, selectedId = null, focusPhase = null;
let layoutSig = '', pos = new Map(), bounds = { w: 0, h: 0 };
const nodeEls = new Map(), edgeEls = [];
let view = { x: 40, y: 40, k: 1 }, fitted = false, pollTimer = null;
let logFor = null, logStatus = null, logToken = 0;

/* ---------- helpers ---------- */
function s(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function h(tag, attrs, text) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
const byId = id => model && model.modules.find(m => m.id === id);
const trunc = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;
function fmtDur(ms) {
  if (ms == null) return '';
  const sec = ms / 1000;
  if (sec < 60) return (sec < 10 ? sec.toFixed(1) : Math.round(sec)) + 's';
  return Math.floor(sec / 60) + 'm ' + String(Math.round(sec % 60)).padStart(2, '0') + 's';
}
function fmtClock(ts) { return ts ? new Date(ts).toLocaleTimeString() : '—'; }
function subText(m) {
  switch (m.status) {
    case 'running': return 'Running · ' + fmtDur(Date.now() - m.startedAt);
    case 'done': return 'Done · ' + fmtDur(m.durationMs);
    case 'failed': return 'Failed · exit ' + m.exitCode + (m.durationMs != null ? ' · ' + fmtDur(m.durationMs) : '');
    case 'skipped': return 'Skipped';
    case 'queued': return 'Queued';
    default: return m.note === 'stopped' ? 'Stopped' : m.note === 'interrupted' ? 'Interrupted' : 'Pending';
  }
}

/* ---------- API ---------- */
async function api(path, body) {
  const opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Buildviz': '1' }, body: JSON.stringify(body) };
  const res = await fetch(path, opt);
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error || msg; } catch (e) { /* not json */ }
    throw new Error(msg);
  }
  return path.startsWith('api/log/') ? res.text() : res.json();
}
function banner(msg, info) {
  const b = $('#banner');
  if (!msg) { b.hidden = true; return; }
  b.textContent = msg; b.className = 'banner' + (info ? ' info' : ''); b.hidden = false;
}

/* ---------- icons ---------- */
function iconFor(status) {
  const g = s('g', { class: 'ico' });
  switch (status) {
    case 'done':
      g.append(s('circle', { r: 8, class: 'fill-done' }), s('path', { d: 'M-3.6 0.2 L-1 2.9 L3.8 -2.6', class: 'mark' })); break;
    case 'failed':
      g.append(s('circle', { r: 8, class: 'fill-failed' }), s('path', { d: 'M-3 -3 L3 3 M3 -3 L-3 3', class: 'mark' })); break;
    case 'running': {
      const spin = s('g', { class: 'spin' });
      spin.append(s('path', { d: 'M-7 0 A7 7 0 0 1 0 -7', class: 'arc' }), s('circle', { r: 7, stroke: 'currentColor', opacity: '.18', style: 'stroke:var(--running)' }));
      g.append(spin); break;
    }
    case 'queued':
      g.append(s('circle', { r: 7, class: 'ring-queued' }), s('path', { d: 'M0 -3.5 V0 L3 2', class: 'ring-queued' })); break;
    case 'skipped':
      g.append(s('circle', { r: 7, class: 'ring-skipped' }), s('path', { d: 'M-3 3 L3 -3', class: 'ring-skipped' })); break;
    default:
      g.append(s('circle', { r: 7, class: 'ring-pending' }));
  }
  return g;
}

/* ---------- layout (layered, crossing-reduced) ---------- */
function layout(mods) {
  const order = new Map(mods.map((m, i) => [m.id, i]));
  const ids = new Set(mods.map(m => m.id));
  const depth = new Map();
  const depthOf = id => {
    if (depth.has(id)) return depth.get(id);
    depth.set(id, 0);                                   // guards against bad data; server rejects cycles
    const ds = mods.find(m => m.id === id).dependsOn.filter(d => ids.has(d));
    const d = ds.length ? 1 + Math.max(...ds.map(depthOf)) : 0;
    depth.set(id, d);
    return d;
  };
  mods.forEach(m => depthOf(m.id));
  const cols = [];
  mods.forEach(m => { const d = depth.get(m.id); (cols[d] = cols[d] || []).push(m); });
  const kids = new Map(mods.map(m => [m.id, []]));
  mods.forEach(m => m.dependsOn.forEach(d => { if (kids.has(d)) kids.get(d).push(m.id); }));
  const maxRows = Math.max(...cols.map(c => c.length));
  const row = new Map();
  const place = c => { const off = (maxRows - cols[c].length) / 2; cols[c].forEach((m, i) => row.set(m.id, off + i)); };
  cols.forEach((_, c) => place(c));
  const mean = (list, fallback) => {
    const v = list.filter(i => row.has(i)).map(i => row.get(i));
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : fallback;
  };
  for (let pass = 0; pass < 6; pass++) {
    const fwd = pass % 2 === 0;
    const seq = cols.map((_, i) => i);
    const run = fwd ? seq.slice(1) : seq.slice(0, -1).reverse();
    for (const c of run) {
      const key = m => fwd ? mean(m.dependsOn, row.get(m.id)) : mean(kids.get(m.id), row.get(m.id));
      cols[c].sort((a, b) => key(a) - key(b) || order.get(a.id) - order.get(b.id));
      place(c);
    }
  }
  const p = new Map();
  cols.forEach((col, c) => col.forEach(m => p.set(m.id, { x: c * (W + GX), y: row.get(m.id) * (H + GY) })));
  return {
    pos: p,
    bounds: { w: cols.length * W + (cols.length - 1) * GX, h: maxRows * H + (maxRows - 1) * GY },
  };
}

/* ---------- graph ---------- */
function buildGraph() {
  const L = layout(model.modules);
  pos = L.pos; bounds = L.bounds;
  $('#nodes').replaceChildren(); $('#edges').replaceChildren();
  nodeEls.clear(); edgeEls.length = 0;

  for (const m of model.modules) for (const d of m.dependsOn) {
    const a = pos.get(d), b = pos.get(m.id);
    if (!a || !b) continue;
    const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
    const k = Math.max(40, (x2 - x1) / 2);
    const el = s('path', { class: 'edge', d: `M${x1} ${y1} C${x1 + k} ${y1}, ${x2 - k} ${y2}, ${x2} ${y2}` });
    $('#edges').append(el);
    edgeEls.push({ from: d, to: m.id, el });
  }

  for (const m of model.modules) {
    const p = pos.get(m.id);
    const g = s('g', { class: 'node', transform: `translate(${p.x},${p.y})`, tabindex: '0', role: 'button' });
    const clip = s('g', { 'clip-path': 'url(#clipcard)' });
    clip.append(s('rect', { class: 'stripe', width: 7, height: H }));
    const icon = s('g', { class: 'icon', transform: 'translate(27,38)' });
    const hover = m.description || m.cmd;
    const tip = s('title', {}, `${m.label}${hover ? '\n' + hover : ''}`);
    g.append(tip, s('rect', { class: 'card', width: W, height: H, rx: 12 }), clip, icon,
      s('text', { class: 'phase', x: 46, y: 19 }, trunc(m.phase, 22)),
      s('text', { class: 'title', x: 46, y: 40 }, trunc(m.label, 20)),
      s('text', { class: 'sub', x: 46, y: 60 }, ''),
      s('circle', { class: 'port', cx: 0, cy: H / 2, r: 4.5 }),
      s('circle', { class: 'port', cx: W, cy: H / 2, r: 4.5 }));
    g.addEventListener('click', () => openPanel(m.id));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel(m.id); } });
    $('#nodes').append(g);
    nodeEls.set(m.id, { g, icon, sub: g.querySelector('.sub'), status: null });
  }
}

function updateGraph() {
  for (const m of model.modules) {
    const n = nodeEls.get(m.id);
    if (!n) continue;
    if (n.status !== m.status) {
      n.status = m.status;
      n.icon.replaceChildren(iconFor(m.status));
    }
    n.g.setAttribute('class', `node s-${m.status}` + (m.id === selectedId ? ' sel' : '') + (focusPhase !== null && m.phase !== focusPhase ? ' dim' : ''));
    n.g.setAttribute('aria-label', `${m.label}: ${STATUS_LABEL[m.status]}`);
    n.sub.textContent = subText(m);
  }
  for (const e of edgeEls) {
    const a = byId(e.from), b = byId(e.to);
    const dim = focusPhase !== null && a.phase !== focusPhase && b.phase !== focusPhase;
    e.el.setAttribute('class', 'edge' + (a.status === 'done' ? ' e-done' : a.status === 'failed' ? ' e-failed' : '') + (b.status === 'running' ? ' flow' : '') + (dim ? ' dim' : ''));
  }
}

/* ---------- header, phases, legend ---------- */
function updateTop() {
  const mods = model.modules, total = mods.length;
  const c = st => mods.filter(m => m.status === st).length;
  const done = c('done'), failed = c('failed'), skipped = c('skipped'), running = c('running');
  $('#project').textContent = model.project;
  document.title = `${model.project} — buildviz`;
  $('#bar > div').style.width = Math.round(done / total * 100) + '%';
  $('#bar').classList.toggle('has-fail', failed > 0);
  $('#progtext').textContent = `${done} / ${total} built` + (failed ? ` · ${failed} failed` : '') + (skipped ? ` · ${skipped} skipped` : '');
  const pill = $('#runstate');
  let st = 'idle', label = 'Idle';
  if (model.running) { st = 'running'; label = running ? 'Building…' : 'Starting…'; }
  else if (failed) { st = 'failed'; label = 'Failed'; }
  else if (done === total) { st = 'done'; label = 'All built'; }
  pill.className = 'pill s-' + st; pill.textContent = label;
  $('#runall').disabled = !!model.running;
  $('#stop').hidden = !model.running;
  banner(model.configError ? `${model.configFile} has an error — showing the last valid version. ${model.configError}` : '');
}

function updatePhases() {
  const nav = $('#phases');
  const names = [...new Set(model.modules.map(m => m.phase).filter(Boolean))];
  nav.hidden = names.length === 0;
  if (!names.length) { focusPhase = null; return; }
  if (focusPhase !== null && !names.includes(focusPhase)) focusPhase = null;
  nav.replaceChildren(...names.map(name => {
    const mods = model.modules.filter(m => m.phase === name);
    const done = mods.filter(m => m.status === 'done').length;
    const cls = ['chip'];
    let mark = '○';
    if (mods.some(m => m.status === 'failed')) { cls.push('has-fail'); mark = '✖'; }
    else if (mods.some(m => m.status === 'running')) { cls.push('is-running'); mark = '▶'; }
    else if (done === mods.length) { cls.push('all-done'); mark = '✔'; }
    const b = h('button', { type: 'button', class: cls.join(' '), 'aria-pressed': String(focusPhase === name), title: 'Click to focus this phase' });
    b.append(h('span', { class: 'mark', 'aria-hidden': 'true' }, mark), h('span', {}, name), h('span', { class: 'count' }, `${done}/${mods.length}`));
    b.addEventListener('click', () => { focusPhase = focusPhase === name ? null : name; updateGraph(); updatePhases(); });
    return b;
  }));
}

function buildLegend() {
  const lg = $('#legend');
  for (const st of ['pending', 'queued', 'running', 'done', 'failed', 'skipped']) {
    const item = h('span');
    const sv = s('svg', { width: 16, height: 16, viewBox: '-9 -9 18 18', 'aria-hidden': 'true' });
    sv.append(iconFor(st));
    item.append(sv, document.createTextNode(STATUS_LABEL[st]));
    lg.append(item);
  }
}

/* ---------- detail panel ---------- */
function timeLine(m) {
  if (m.status === 'running') return 'for ' + fmtDur(Date.now() - m.startedAt);
  if (m.durationMs != null) return 'took ' + fmtDur(m.durationMs);
  return '';
}
function openPanel(id) { selectedId = id; logFor = null; updateGraph(); updatePanel(); }
function closePanel() { selectedId = null; updateGraph(); updatePanel(); }

let metaSig = '';
function updatePanel() {
  const panel = $('#panel');
  const m = selectedId && byId(selectedId);
  if (!m) { panel.hidden = true; return; }
  panel.hidden = false;
  $('#p-phase').textContent = m.phase || 'Module';
  $('#p-title').textContent = m.label;
  const pill = $('#p-status'); pill.className = 'pill s-' + m.status; pill.textContent = STATUS_LABEL[m.status];
  $('#p-time').textContent = timeLine(m);
  const d = $('#p-desc'); d.textContent = m.description; d.hidden = !m.description;
  $('#p-cmd').textContent = m.cmd || '(milestone — no command; it completes once its dependencies are done)';
  const busy = !!model.running;
  $('#p-run').disabled = busy; $('#p-run-down').disabled = busy;

  const sig = JSON.stringify([m.id, m.cwd, m.dependsOn, m.startedAt, m.endedAt, m.exitCode, m.note, m.status]);
  if (sig !== metaSig) {
    metaSig = sig;
    const dl = $('#p-meta'); dl.replaceChildren();
    const row = (k, v) => { dl.append(h('dt', {}, k)); const dd = h('dd'); if (v instanceof Node) dd.append(v); else dd.textContent = v; dl.append(dd); };
    if (m.dependsOn.length) {
      const wrap = h('span');
      m.dependsOn.forEach(dep => {
        const dm = byId(dep);
        const b = h('button', { type: 'button', class: 'dep', title: 'Open ' + dep }, (dm ? dm.label : dep) + (dm ? ' · ' + STATUS_LABEL[dm.status].toLowerCase() : ''));
        b.addEventListener('click', () => openPanel(dep));
        wrap.append(b);
      });
      row('Needs', wrap);
    } else row('Needs', 'nothing — can start immediately');
    row('Working dir', m.cwd);
    row('Started', fmtClock(m.startedAt));
    row('Finished', m.status === 'running' ? 'in progress' : fmtClock(m.endedAt));
    if (m.exitCode != null) row('Exit code', String(m.exitCode));
    if (m.note) row('Note', m.note);
  }

  if (logFor !== m.id || logStatus !== m.status || m.status === 'running') {
    logFor = m.id; logStatus = m.status;
    const token = ++logToken;
    api('api/log/' + encodeURIComponent(m.id)).then(text => {
      if (token !== logToken || selectedId !== m.id) return;
      const pre = $('#p-log');
      if (pre.textContent === text) return;
      const atEnd = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
      pre.textContent = text;
      if (atEnd) pre.scrollTop = pre.scrollHeight;
    }).catch(() => {});
  }
}

/* ---------- actions ---------- */
async function startRun(id, mode) {
  try { await api('api/run', { id: id || null, mode }); banner(''); await refresh(); }
  catch (e) { banner(e.message); }
}
async function stopRun() {
  try { await api('api/stop', {}); await refresh(); } catch (e) { banner(e.message); }
}

/* ---------- polling ---------- */
function apply() {
  const sig = JSON.stringify(model.modules.map(m => [m.id, m.label, m.phase, m.dependsOn]));
  if (sig !== layoutSig) {
    layoutSig = sig;
    buildGraph();
    if (!fitted) { fit(); fitted = true; }
  }
  updateGraph(); updateTop(); updatePhases(); updatePanel();
}
async function refresh() {
  try {
    model = await api('api/state');
    apply();
  } catch (e) {
    banner('Cannot reach the buildviz server (' + e.message + '). Is `node buildviz.js` still running?');
  }
  schedule();
}
function schedule() {
  clearTimeout(pollTimer);
  const running = model && model.running;
  if (document.hidden || !(running || $('#auto').checked)) return;
  pollTimer = setTimeout(refresh, running ? 1000 : 4000);
}

/* ---------- pan & zoom ---------- */
const svgEl = $('#graph');
function applyView() { $('#viewport').setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }
function fit() {
  const r = svgEl.getBoundingClientRect();
  const k = Math.max(0.3, Math.min(1.1, (r.width - 80) / Math.max(bounds.w, 1), (r.height - 80) / Math.max(bounds.h, 1)));
  view.k = k;
  view.x = Math.max(20, (r.width - bounds.w * k) / 2);
  view.y = Math.max(20, (r.height - bounds.h * k) / 2);
  applyView();
}
function zoomAt(cx, cy, f) {
  const r = svgEl.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const k = Math.min(2.5, Math.max(0.25, view.k * f));
  view.x = px - (px - view.x) * (k / view.k);
  view.y = py - (py - view.y) * (k / view.k);
  view.k = k; applyView();
}
function zoomCenter(f) { const r = svgEl.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f); }
let drag = null;
svgEl.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('.node')) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
  try { svgEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  svgEl.classList.add('panning');
});
svgEl.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  view.x = drag.vx + dx; view.y = drag.vy + dy; applyView();
});
const endDrag = () => { if (drag && !drag.moved && selectedId) closePanel(); drag = null; svgEl.classList.remove('panning'); };
svgEl.addEventListener('pointerup', endDrag);
svgEl.addEventListener('pointercancel', () => { drag = null; svgEl.classList.remove('panning'); });
svgEl.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
  else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
}, { passive: false });

/* ---------- wire up ---------- */
$('#refresh').addEventListener('click', refresh);
$('#auto').addEventListener('change', schedule);
$('#runall').addEventListener('click', () => startRun(null, 'only'));
$('#stop').addEventListener('click', stopRun);
$('#p-run').addEventListener('click', () => startRun(selectedId, 'only'));
$('#p-run-down').addEventListener('click', () => startRun(selectedId, 'downstream'));
$('#p-close').addEventListener('click', closePanel);
$('#zin').addEventListener('click', () => zoomCenter(1.2));
$('#zout').addEventListener('click', () => zoomCenter(1 / 1.2));
$('#zfit').addEventListener('click', fit);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && selectedId) closePanel(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
buildLegend();
refresh();
})();
</script>
</body>
</html>
