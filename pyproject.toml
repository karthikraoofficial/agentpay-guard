[project]
name = "agentpay-guard"
version = "0.1.0"
description = "Trust layer for agent-initiated payments: mandates, real-time decisions, durable consent and dispute evidence packs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.28",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "adapters", "workflows", "agents", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions", "tests/architecture/fixtures", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["api", "core", "adapters", "workflows", "agents", "evals"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not perf'"
markers = ["perf: latency budgets; run with `uv run pytest -m perf -s`"]
