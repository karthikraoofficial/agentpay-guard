# The hosted demo on one VM (ADR-0021), on top of docker-compose.yml:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
# .env is the VM's copy of .env.production.example. Only Caddy is public (80 and 443);
# Postgres, Temporal and the collector are reachable on the compose network only.

x-app: &app
  build:
    context: ..
  image: agentpay-guard:latest
  restart: unless-stopped
  env_file:
    - path: ${AGENTPAY_APP_ENV_FILE:-../.env}
  # Where the services are on the compose network; the rest comes from the env file.
  environment:
    AGENTPAY_DATABASE_URL: postgresql+psycopg://agentpay:${AGENTPAY_POSTGRES_PASSWORD:?set AGENTPAY_POSTGRES_PASSWORD}@postgres:5432/agentpay
    AGENTPAY_TEMPORAL_ADDRESS: temporal:7233
    AGENTPAY_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318

services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    environment:
      # Read only when the volume is first created; changing it later needs ALTER ROLE.
      POSTGRES_PASSWORD: ${AGENTPAY_POSTGRES_PASSWORD:?set AGENTPAY_POSTGRES_PASSWORD}

  temporal:
    restart: unless-stopped
    ports: !reset []

  otel-collector:
    restart: unless-stopped
    ports: !reset []

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *app
    command: ["python", "-m", "workflows.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    # Host ports are 80 and 443 on the VM; the smoke test moves them off privileged ports.
    ports:
      - "${AGENTPAY_HTTP_PORT:-80}:80"
      - "${AGENTPAY_HTTPS_PORT:-443}:443"
      - "${AGENTPAY_HTTPS_PORT:-443}:443/udp"
    environment:
      AGENTPAY_API_HOST: ${AGENTPAY_API_HOST:?set AGENTPAY_API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddydata:
  caddyconfig:
