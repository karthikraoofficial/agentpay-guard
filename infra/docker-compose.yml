# Local stack: `docker compose --env-file .env -f infra/docker-compose.yml up -d`
# Postgres on 5432, Temporal on 7233 (web UI on 8233), OTLP collector on 4317/4318.
# The env file only switches on the collector's Langfuse exporter; without it (or without
# the Langfuse keys in it) the collector prints spans to its log, nothing more.
name: agentpay-guard

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: agentpay
      POSTGRES_PASSWORD: agentpay # local only; never reuse outside this compose file
      POSTGRES_DB: agentpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpay -d agentpay"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporaldata:/home/temporal

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    # Langfuse is added only when its public key is set. Keys reach the collector by
    # environment and are never written in its config.
    command: --config=/etc/otelcol/config.yaml ${AGENTPAY_LANGFUSE_PUBLIC_KEY:+--config=/etc/otelcol/langfuse.yaml}
    environment:
      LANGFUSE_PUBLIC_KEY: ${AGENTPAY_LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${AGENTPAY_LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${AGENTPAY_LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ./otel-collector.langfuse.yaml:/etc/otelcol/langfuse.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  pgdata:
  temporaldata:
